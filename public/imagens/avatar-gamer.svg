<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#08469e"/>
      <stop offset="100%" stop-color="#051329"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="headsetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd5b8"/>
      <stop offset="100%" stop-color="#f6be98"/>
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2f"/>
      <stop offset="100%" stop-color="#12121a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Circular -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGlow)" stroke="#00f2fe" stroke-width="2.5" filter="url(#glow)"/>
  
  <!-- Círculo Interno com Máscara para manter o avatar recortado perfeitamente -->
  <g clip-path="url(#circleClip)">
    <clipPath id="circleClip">
      <circle cx="60" cy="60" r="57"/>
    </clipPath>

    <!-- Fundo de iluminação gamer sutil -->
    <circle cx="60" cy="55" r="45" fill="#08469e" opacity="0.35"/>

    <!-- Jaqueta / Moletom Gamer -->
    <path d="M22 120 C22 95 38 88 48 85 L60 96 L72 85 C82 88 98 95 98 120 Z" fill="url(#hoodieGrad)"/>
    <path d="M48 85 L60 96 L72 85 L60 115 Z" fill="#0e0e17"/>
    <!-- Detalhe Neon da Jaqueta -->
    <path d="M48 85 L60 96 L72 85" fill="none" stroke="url(#neonCyan)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60" y1="96" x2="60" y2="120" stroke="#00f2fe" stroke-width="2"/>

    <!-- Pescoço -->
    <rect x="52" y="70" width="16" height="20" rx="4" fill="url(#skinGrad)"/>

    <!-- Rosto -->
    <path d="M42 45 C42 35 48 26 60 26 C72 26 78 35 78 45 C78 62 69 74 60 74 C51 74 42 62 42 45 Z" fill="url(#skinGrad)"/>

    <!-- Cabelo Gamer Moderno -->
    <path d="M40 42 C38 30 46 20 60 20 C74 20 81 28 80 38 C75 32 68 30 60 30 C50 30 45 35 40 42 Z" fill="#2d3748"/>
    <path d="M45 28 Q55 18 68 24 Q60 20 50 25 Z" fill="#4a5568"/>

    <!-- Olhos estilizados gamer -->
    <ellipse cx="52" cy="48" rx="2.5" ry="3" fill="#1e293b"/>
    <ellipse cx="68" cy="48" rx="2.5" ry="3" fill="#1e293b"/>
    <circle cx="53" cy="47" r="0.8" fill="#fff"/>
    <circle cx="69" cy="47" r="0.8" fill="#fff"/>

    <!-- Sorriso Gamer sutil -->
    <path d="M56 61 Q60 64 64 61" fill="none" stroke="#ba7354" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Headset Gamer Pro (Arco superior) -->
    <path d="M35 44 C35 24 45 13 60 13 C75 13 85 24 85 44" fill="none" stroke="url(#headsetGrad)" stroke-width="6" stroke-linecap="round"/>
    <path d="M36 42 C36 26 46 15 60 15 C74 15 84 26 84 42" fill="none" stroke="url(#neonCyan)" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Conchas / Almofadas do Headset com LED Neon -->
    <rect x="30" y="38" width="11" height="22" rx="5" fill="#111827" stroke="#00f2fe" stroke-width="2"/>
    <circle cx="35.5" cy="49" r="3" fill="#00f2fe" filter="url(#glow)"/>

    <rect x="79" y="38" width="11" height="22" rx="5" fill="#111827" stroke="#00f2fe" stroke-width="2"/>
    <circle cx="84.5" cy="49" r="3" fill="#00f2fe" filter="url(#glow)"/>

    <!-- Microfone do Headset com LED de status -->
    <path d="M34 54 Q38 68 50 67" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="51" cy="67" r="2.2" fill="#00f2fe"/>
  </g>
</svg>
