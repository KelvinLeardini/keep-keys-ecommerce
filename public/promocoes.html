<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keep Keys - Promoções e Ofertas</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="favicon" href="/imagens/Logo-1.png" type="image/png">
</head>
<body>
    
    <!-- Barra Lateral Original -->
    <aside>
        <div class="logo">
            <a href="/index.html" class="logo-link"><img src="/imagens/Logo-1.png" alt="logo da loja"></a>
        </div>

        <nav>
            <ul>
                <li><a href="/lancamentos.html"><i data-lucide="rocket"></i> Lançamentos</a></li>
                <li><a href="/promocoes.html"><i data-lucide="tag"></i> Promoções</a></li>

                <!-- Linha Divisória -->
                <hr class="divisoria">

                <li><a href="/jogos/ps/ps.html"><i data-lucide="gamepad-2"></i> Playstation</a></li>
                <li><a href="/jogos/xbox/xbox.html"><i data-lucide="box"></i> Xbox</a></li>
                <li><a href="/jogos/steam/Steam.html"><i data-lucide="monitor"></i> Steam</a></li>
            </ul>
        </nav>
        
        <div class="footer-redes">
            <div class="icones-redes">
                <a href="https://www.instagram.com/" aria-label="Instagram" target="_blank">
                    <svg class="lucide" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="20" height="20" x="2" y="2" rx="5" ry="5"></rect>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                    <line x1="17.5" x2="17.51" y1="6.5" y2="6.5"></line>
        </svg>
                </a>
                <a href="https://www.facebook.com/" aria-label="Facebook" target="_blank">
                    <svg class="lucide" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>
        </svg>
                </a>
            </div>
        </div>
    </aside>

    <div class="site">
        <!-- Header igualzinho ao da Home -->
        <header>
            <button type="button" class="btn-hamburguer" id="btn-hamburguer" aria-label="Abrir Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <form action="#">
                <div class="buscar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#888888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" placeholder="Buscar promoções...">
                </div>
            </form>

            <div class="area-usuario">
                <button type="button" id="btn-entrar-header">Entrar</button>

                <div id="painel-usuario" class="painel-usuario" style="display: none;">

                    <button type="button" id="btn-abrir-carrinho" class="btn-carrinho-icone" aria-label="Abrir Carrinho">
                        <i data-lucide="shopping-cart"></i>
                        <span id="contador-carrinho" class="contador-badge">0</span>
                    </button>

                    <a href="admin.html" id="btn-admin-header" class="btn-admin" style="display: none;">
                        Painel Admin
                    </a>
                    <span>Olá, <strong>Gamer</strong>!</span>
                    <button type="button" id="btn-sair-header" class="btn-sair">Sair</button>
                </div>
            </div>
        </header>

        <main>
            <!-- Banner de Destaque de Ofertas -->
            <section class="banner">
                <div class="lanc-banner" style="width: 100%; max-width: 1000px; height: 350px;">
                    <img src="/imagens/Resident Evil Requiem.jpg" alt="Promoções Especiais" class="fade-img" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
            </section>

            <!-- Seção de Jogos em Promoção -->
            <section class="produtos">
                <h3>Ofertas Imperdíveis</h3>

                <div class="grade-produtos" data-categoria="promocao">
                    <!-- Carregado dinamicamente via JS a partir de dados/jogos.json -->
                </div>           
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Keep Keys - Sua Loja Gamer. Todos os direitos reservados.</p>
            <ul>
                <li><a href="suporte.html">Suporte</a></li>
                <li><a href="sobre.html">Sobre Nós</a></li>
                <li><a href="pagamentos.html">Pagamentos</a></li>
            </ul>
        </footer>

    </div>

    <!-- Modal / Gaveta do Carrinho de Compras -->
    <div id="modal-carrinho" class="modal-carrinho">
        <div class="conteudo-carrinho">
            <div class="cabecalho-carrinho">
                <h3><i data-lucide="shopping-bag"></i> Seu Carrinho</h3>
                <span id="fechar-carrinho" class="fechar-carrinho">&times;</span>
            </div>

            <!-- Lista de itens adicionados -->
            <div class="lista-itens-carrinho" id="lista-itens-carrinho">
                <!-- Exemplo visual de um item no carrinho para testarmos o design -->
                <div class="item-carrinho">
                    <img src="/imagens/control.jpg" alt="Control: Resonant">
                    <div class="detalhes-item">
                        <h4>Control: Resonant</h4>
                        <p class="preco-item">R$ 149,90</p>
                    </div>
                    <button type="button" class="btn-remover-item"><i data-lucide="trash-2"></i></button>
                </div>
            </div>

            <!-- Rodapé do Carrinho com Total e Botão de Checkout -->
            <div class="rodape-carrinho">
                <div class="total-carrinho">
                    <span>Total:</span>
                    <strong id="valor-total-carrinho">R$ 149,90</strong>
                </div>
                <button type="button" class="btn-finalizar-compra">Finalizar Compra</button>
            </div>
        </div>
    </div>

    <!-- CDN do Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Vincula o script padrão do site para manter o login e menu hambúrguer funcionais -->
    <script src="/js/script.js"></script>

</body>
</html>
